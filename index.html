        // Dynamic Interactive Particle Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const maxStars = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = (Math.random() - 0.5) * 0.15;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < maxStars; i++) {
            stars.push(new Star());
        }

        function animateBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateBackground);
        }
        animateBackground();

        async function fetchDiscordProfile(discordId) {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.data) {
                        return data.data;
                    }
                }
                return null;
            } catch (error) {
                console.warn(`Failed to fetch ${discordId}:`, error);
                return null;
            }
        }

        function generateActivityHTML(data) {
            if (!data) return '<div class="activity-details">✨ No activity data available</div>';

            let html = '';
            const spotify = data.spotify;
            const activities = data.activities || [];
            const customStatus = activities.find(a => a.type === 4);

            if (customStatus && customStatus.state) {
                let emojiHtml = '';
                if (customStatus.emoji) {
                    if (customStatus.emoji.id) {
                        emojiHtml = `<img src="https://cdn.discordapp.com/emojis/${customStatus.emoji.id}.${customStatus.emoji.animated ? 'gif' : 'png'}" style="width:16px;height:16px;margin-right:5px;">`;
                    } else if (customStatus.emoji.name) {
                        emojiHtml = `<span style="margin-right:5px;">${customStatus.emoji.name}</span>`;
                    }
                }
                html += `<div class="activity-details"><div class="activity-type">${emojiHtml} ${customStatus.state}</div></div>`;
            }

            if (spotify) {
                html += `<div class="spotify-activity">
                    <div class="spotify-header"><i class='bx bxl-spotify'></i><span>Listening to Spotify</span></div>
                    <div class="spotify-content">
                        <img class="album-art" src="${spotify.album_art_url}" onerror="this.style.display='none'">
                        <div>
                            <div class="song-title">${spotify.song.substring(0, 30)}</div>
                            <div class="song-artist">${spotify.artist.substring(0, 30)}</div>
                        </div>
                    </div>
                </div>`;
            }

            const gameActivity = activities.find(a => a.type === 0 && a.name !== 'Spotify');
            if (gameActivity && !spotify) {
                html += `<div class="activity-details">
                    <div class="activity-type">🎮 Playing ${gameActivity.name}</div>
                    ${gameActivity.details ? `<div class="activity-info">${gameActivity.details.substring(0, 40)}</div>` : ''}
                </div>`;
            }

            if (!html) {
                html = '<div class="activity-details">💤 No current activity</div>';
            }

            return html;
        }

        // Profile views & likes database integration
        async function loadProfileMetrics(username) {
            const viewsEl = document.getElementById('metric-views');
            const likesEl = document.getElementById('metric-likes');
            const likeIcon = document.getElementById('like-icon');

            if (!viewsEl || !likesEl) return;

            // Check if liked in localStorage
            if (localStorage.getItem(`liked_${username}`)) {
                likeIcon.className = "bx bxs-heart";
                likeIcon.style.color = "#ff4757";
            } else {
                likeIcon.className = "bx bx-heart";
                likeIcon.style.color = "";
            }

            try {
                const docRef = db.collection('counters').doc('profile_views_' + username);
                let doc = await docRef.get();

                if (!doc.exists) {
                    await docRef.set({ count: 1 });
                    viewsEl.textContent = "1";

                    // Fetch likes count as well
                    const likeDocRef = db.collection('counters').doc('profile_likes_' + username);
                    let likeDoc = await likeDocRef.get();
                    likesEl.textContent = likeDoc.exists ? (likeDoc.data().count || 0) : "0";
                    return;
                }

                let data = doc.data();
                let newViews = (data.count || 0) + 1;

                // Update views in Firestore
                await docRef.update({ count: newViews });

                viewsEl.textContent = newViews;

                // Fetch likes count as well
                const likeDocRef = db.collection('counters').doc('profile_likes_' + username);
                let likeDoc = await likeDocRef.get();
                likesEl.textContent = likeDoc.exists ? (likeDoc.data().count || 0) : "0";
            } catch (e) {
                console.error("Error loading profile metrics:", e);
                // Fallback local simulation if Firestore fails/is not configured
                let localViews = parseInt(localStorage.getItem(`views_${username}`) || "0") + 1;
                localStorage.setItem(`views_${username}`, localViews);
                let localLikes = parseInt(localStorage.getItem(`likes_${username}`) || "0");
                viewsEl.textContent = localViews;
                likesEl.textContent = localLikes;
            }
        }

        async function likeProfile() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const member = members.find(m => m.username === hash);
            if (!member) return;

            const username = member.username;
            const likeIcon = document.getElementById('like-icon');
            const likesEl = document.getElementById('metric-likes');

            if (localStorage.getItem(`liked_${username}`)) {
                // Unlike
                localStorage.removeItem(`liked_${username}`);
                likeIcon.className = "bx bx-heart";
                likeIcon.style.color = "";

                try {
                    const docRef = db.collection('counters').doc('profile_likes_' + username);
                    await db.runTransaction(async (transaction) => {
                        const sfDoc = await transaction.get(docRef);
                        if (!sfDoc.exists) return;
                        const newLikes = Math.max(0, (sfDoc.data().count || 0) - 1);
                        transaction.update(docRef, { count: newLikes });
                        likesEl.textContent = newLikes;
                    });
                } catch (e) {
                    console.error("Firestore unlike failed:", e);
                    let localLikes = Math.max(0, parseInt(localStorage.getItem(`likes_${username}`) || "0") - 1);
                    localStorage.setItem(`likes_${username}`, localLikes);
                    likesEl.textContent = localLikes;
                }
            } else {
                // Like
                localStorage.setItem(`liked_${username}`, "true");
                likeIcon.className = "bx bxs-heart";
                likeIcon.style.color = "#ff4757";

                try {
                    const docRef = db.collection('counters').doc('profile_likes_' + username);
                    await db.runTransaction(async (transaction) => {
                        const sfDoc = await transaction.get(docRef);
                        if (!sfDoc.exists) {
                            transaction.set(docRef, { count: 1 });
                            likesEl.textContent = "1";
                            return;
                        }
                        const newLikes = (sfDoc.data().count || 0) + 1;
                        transaction.update(docRef, { count: newLikes });
                        likesEl.textContent = newLikes;
                    });
                } catch (e) {
                    console.error("Firestore like failed:", e);
                    let localLikes = parseInt(localStorage.getItem(`likes_${username}`) || "0") + 1;
                    localStorage.setItem(`likes_${username}`, localLikes);
                    likesEl.textContent = localLikes;
                }
            }
        }

        ];

        let currentTrack = 0, isPlaying = false, isLooping = true;
        const audio = document.getElementById('background-music');
        const playPauseBtn = document.getElementById('play-pause');
        const prevBtn = document.getElementById('prev-track');
        const nextBtn = document.getElementById('next-track');
        const loopBtn = document.getElementById('loop-track');
        const muteBtn = document.getElementById('mute-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        const progress = document.getElementById('progress');
        const progressBar = document.querySelector('.progress-bar');
        const currentTimeSpan = document.getElementById('current-time');
        const durationSpan = document.getElementById('duration');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const trackArtwork = document.getElementById('track-artwork');

        // Welcome Gate Overlay Fade Handler (Audio starts on click)
        const welcomeOverlay = document.getElementById('welcome-overlay');
        welcomeOverlay.addEventListener('click', () => {
            welcomeOverlay.classList.add('fade-out');
            setTimeout(() => {
                welcomeOverlay.style.display = 'none';
            }, 1000);

            isPlaying = true;
            audio.play().then(() => {
                playPauseBtn.innerHTML = '<i class="bx bx-pause"></i>';
            }).catch(e => {
                console.log("Audio playback deferred:", e);
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="bx bx-play"></i>';
            });
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function loadTrack(index) {
            currentTrack = (index + playlist.length) % playlist.length;
            const track = playlist[currentTrack];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            trackArtwork.src = track.artwork;
            trackArtwork.onerror = function () { this.src = 'https://placehold.co/54'; };
            progress.style.width = '0%';
            currentTimeSpan.textContent = '0:00';
            if (isPlaying) {
                audio.play().catch(e => console.log('Playback error:', e));
            }
        }

        function playPause() {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.innerHTML = '<i class="bx bx-play"></i>';
            } else {
                audio.play().catch(e => console.log('Playback error:', e));
                playPauseBtn.innerHTML = '<i class="bx bx-pause"></i>';
            }
            isPlaying = !isPlaying;
        }

        function updateProgress() {
            if (audio.duration) {
                progress.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                durationSpan.textContent = formatTime(audio.duration);
            }
        }

        function setProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => { if (isLooping) loadTrack(currentTrack + 1); });
        audio.addEventListener('error', (e) => console.log('Audio error:', e));

        playPauseBtn.addEventListener('click', playPause);
        prevBtn.addEventListener('click', () => loadTrack(currentTrack - 1));
        nextBtn.addEventListener('click', () => loadTrack(currentTrack + 1));
        loopBtn.addEventListener('click', () => { isLooping = !isLooping; loopBtn.style.opacity = isLooping ? '1' : '0.5'; });
        muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; muteBtn.innerHTML = audio.muted ? '<i class="bx bx-volume-mute"></i>' : '<i class="bx bx-volume-full"></i>'; });
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
        progressBar.addEventListener('click', setProgress);

        // Check hash on startup to trigger modal
        const checkStartupHash = () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                openProfile(hash);
            }
        };

        loadTrack(0);
        renderHallOfFame();
        setInterval(renderHallOfFame, 30000);
        setTimeout(checkStartupHash, 500);
    </script>

    <!-- SVG Ragged Edge Filter -->
    <svg style="position: absolute; width: 0; height: 0;" width="0" height="0">
        <defs>
            <filter id="ragged-edge">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>
</body>
